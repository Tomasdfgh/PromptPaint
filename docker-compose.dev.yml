services:
  model:
    build:
      context: .
      dockerfile: src/model/Dockerfile
    container_name: promptpaint-model-dev
    ports:
      - "8000:8000"
    volumes:
      - ./src/model:/app
      - model-cache:/model-cache
    environment:
      - HF_HOME=/model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: promptpaint-backend-dev
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./src/backend:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - MODEL_SERVICE_URL=http://model:8000

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./src/frontend/src:/app/src
      - ./src/frontend/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - DANGEROUSLY_DISABLE_HOST_CHECK=true

volumes:
  model-cache:
    name: promptpaint-model-cache
