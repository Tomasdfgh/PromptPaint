services:
  model:
    build:
      context: .
      dockerfile: src/model/Dockerfile
    container_name: promptpaint-model
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/model-cache
    environment:
      - HF_HOME=/model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: promptpaint-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - MODEL_SERVICE_URL=http://model:8000
    depends_on:
      model:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: promptpaint-frontend
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: promptpaint-network

volumes:
  model-cache:
    name: promptpaint-model-cache
